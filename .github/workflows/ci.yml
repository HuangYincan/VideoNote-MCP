name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies (Python ${{ matrix.python-version }})
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --frozen --python ${{ matrix.python-version }}
      - name: Ruff F/I lint
        run: uv run ruff check --select F,I .
      - name: Server imports
        run: uv run python -c "import videonote_mcp.server; print('import OK')"
      - name: MCP initialization, tools and offline templates over stdio
        run: uv run python tests/mcp_stdio_smoke.py
      - name: Build and verify standalone wheel
        run: |
          uv build --no-sources
          uv run python tests/mcp_stdio_smoke.py --wheel dist/videonote-*.whl
      - name: CLI smoke
        run: uv run videonote providers list
      - name: Unit tests
        run: uv run pytest -q

  # 汇总 job：保留稳定 context "Smoke test"，供仓库保护规则引用
  # （矩阵 job 名带 Python 版本）。needs 矩阵全部通过才绿，
  # 任一失败即失败（fail-fast: false 保证三个版本都跑完）。
  smoke-summary:
    name: Smoke test
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - run: echo "Smoke tests passed (Python 3.11/3.12/3.13)"

  # 真实转写集成冒烟（docs/05 #139 C2）：仅手动触发（workflow_dispatch），
  # 不进 push/PR 默认门禁——模型下载有网络/时长成本。跑 tests/test_integration_transcribe.py
  # 的真实引擎实例化 + 模型加载 + 推理路径（其余测试全在 get_transcriber 之上打桩）。
  integration-transcribe:
    name: Integration transcribe (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen
      - name: Real transcription smoke (fast-whisper tiny, model downloads on first run)
        run: |
          VIDEONOTE_RUN_INTEGRATION=1 uv run pytest tests/test_integration_transcribe.py -q
