name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies (Python ${{ matrix.python-version }})
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --frozen --python ${{ matrix.python-version }}
      - name: Ruff F-class lint
        run: uv run ruff check --select F .
      - name: Server imports
        run: uv run python -c "import videonote_mcp.server; print('import OK')"
      - name: MCP tools/list over stdio
        run: |
          uv run python - <<'EOF'
          import asyncio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(command="uv", args=["run", "videonote"])
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      names = sorted(t.name for t in tools.tools)
                      # 名单断言（docs/05 #70）：数量断言放过名字漂移（get_task_status 曾
                      # 丢失装饰器仍 38 全绿），必须精确匹配。改名/增删工具时同步这里
                      # （#135/#136/#138：16 → 10，任务/清理/媒体/体检四组合并）。
                      expected = [
                          "batch_generate_notes", "cleanup", "generate_note", "get_config",
                          "health_check", "inspect_video", "list_tasks",
                          "prepare_note_material", "process_media", "task",
                      ]
                      assert names == expected, f"工具名单漂移: {names}"
                      print(f"tools/list OK: {len(names)} tools (名单精确匹配)")
          asyncio.run(main())
          EOF
      - name: CLI smoke
        run: uv run videonote providers list
      - name: Unit tests
        run: uv run pytest -q

  # 汇总 job：main 分支保护规则要求 context "Smoke test"（矩阵 job 名带
  # Python 版本，规则早于矩阵化配置）。needs 矩阵全部通过才绿，
  # 任一失败即失败（fail-fast: false 保证三个版本都跑完）。
  smoke-summary:
    name: Smoke test
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - run: echo "Smoke tests passed (Python 3.11/3.12/3.13)"

  # 真实转写集成冒烟（docs/05 #139 C2）：仅手动触发（workflow_dispatch），
  # 不进 push/PR 默认门禁——模型下载有网络/时长成本。跑 tests/test_integration_transcribe.py
  # 的真实引擎实例化 + 模型加载 + 推理路径（其余测试全在 get_transcriber 之上打桩）。
  integration-transcribe:
    name: Integration transcribe (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen
      - name: Real transcription smoke (fast-whisper tiny, model downloads on first run)
        run: |
          VIDEONOTE_RUN_INTEGRATION=1 uv run pytest tests/test_integration_transcribe.py -q
