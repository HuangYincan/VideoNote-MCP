  <text x="1178" y="392" font-size="13" font-weight="600" fill="#2B2B3A" text-anchor="middle">Refined + original</text>
  <text x="1178" y="412" font-size="10" fill="#8A8A9A" text-anchor="middle">note.md · original kept</text>

