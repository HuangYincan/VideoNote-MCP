  <rect x="480" y="534" width="200" height="30" rx="15" fill="#ECE9FA" stroke="#D8D3F4"/>
  <text x="580" y="553" font-size="11" fill="#4A44A8" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cleanup_note / cleanup_all</tspan><tspan> · clean</tspan></text>
